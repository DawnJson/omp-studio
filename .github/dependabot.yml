# 每月一次依赖升级 PR。开发依赖和运行时依赖分两组，免得一个月几十个 PR；workflow 里的 actions 版本合成一个 PR。
# Electron 单独一组：每 8 周一个大版本，安全更新要跟上，大版本升级要单独看 release notes 和 e2e。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # @types/node 跟 Electron 内置的 Node 同一个主版本（Electron 44 是 Node 24）：类型比运行时新，类型检查会放过运行时没有的 API。
    # 主版本随 Electron 升级时手动改。
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      electron:
        patterns: [electron]
      dev:
        dependency-type: development
        exclude-patterns: [electron]
      runtime:
        dependency-type: production
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
