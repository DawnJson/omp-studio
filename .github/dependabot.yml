# 每月一次依赖升级 PR（PLAN 阶段 2.5）。开发依赖和运行时依赖分两组，免得一个月几十个 PR。
# Electron 单独一组：每 8 周一个大版本，安全更新要跟上，大版本升级要单独看 release notes 和 e2e。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      electron:
        patterns: [electron]
      dev:
        dependency-type: development
        exclude-patterns: [electron]
      runtime:
        dependency-type: production
