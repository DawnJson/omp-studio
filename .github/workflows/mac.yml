# mac 版（Apple 芯片）：在 GitHub 的 macOS 机器上跑单测、一条真正发 prompt 的 e2e，打 ad-hoc 签名的 dmg / zip 作为构建产物。
# 推版本 tag 时还把 dmg / zip 传到这个版本的 GitHub Release（scripts/publish-release.ts）。
# 没有 Apple Developer 账号：不公证、不写更新源（docs/architecture/mac.md）。
# 推到 main（只改文档的推送不跑）、推版本 tag 或手动触发时跑（公开仓库用 GitHub 的 macOS 机器不计费）；同一分支连推时只留最新一次。
name: mac

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    # 只对分支推送生效：GitHub 推 tag 时不看路径过滤，发版构建照跑。*.md 不进构建也不过 Prettier（.prettierignore），
    # 但 CHANGELOG.md 会打进主进程（whats-new.ts），不能列进来。
    paths-ignore: ["docs/**", "README.md", "README.zh-CN.md", "AGENTS.md", "LESSONS.md"]

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Electron（npm ci 时下载）和 electron-builder 工具的下载缓存，版本跟着 package-lock.json 走。
      - uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - run: npm ci

      - name: 代码检查
        run: npm run lint

      - name: 格式检查
        run: npm run format:check

      - name: 类型检查
        run: npm run typecheck

      - name: 单测
        run: npx vitest run

      - name: 构建
        run: npm run build

      # 真实的 node-pty + TSP 路径：假 omp 回放录制，发一句 prompt 跑完一整轮（不需要真模型）。
      - name: e2e 冒烟
        run: npx playwright test test/e2e/tsp.e2e.ts -g "完整一轮"

      - name: 打包（ad-hoc 签名）
        run: npx electron-builder --mac --arm64 --publish never

      # 包里该有的东西：app.asar 只有 out/、package.json、node_modules/（scripts/check-package.ts），
      # node-pty 的 darwin-arm64 预编译件、spawn-helper 带执行位、签名有效。
      - name: 检查产物
        run: |
          app="release/mac-arm64/omp-studio.app"
          node scripts/check-package.ts "$app/Contents/Resources/app.asar" darwin-arm64
          prebuilds="$app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds"
          ls -l "$prebuilds"
          test -f "$prebuilds/darwin-arm64/pty.node"
          test -x "$prebuilds/darwin-arm64/spawn-helper"
          test ! -e "$prebuilds/win32-x64"
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
          plutil -p "$app/Contents/Info.plist" | grep -E "CFBundleName|CFBundleShortVersionString"

      # 打包版才有的问题（如启动时窗口一直透明，见 scripts/smoke-packaged.ts）上面的 e2e 测不到：启动打包好的应用，等窗口淡入。
      - name: 打包版冒烟
        run: node scripts/smoke-packaged.ts release/mac-arm64/omp-studio.app/Contents/MacOS/omp-studio

      - name: 传到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.ts "${GITHUB_REF_NAME#v}" release/*.dmg release/*.zip

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: omp-studio-mac-arm64
          if-no-files-found: ignore
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          if-no-files-found: ignore
          retention-days: 7
          path: test-results/
