<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="12">
  <!-- 方向 A「仪表」浅色主界面线框。颜色就是提议的色板，尺寸按 1200×800 窗口缩到 1000 宽。 -->
  <rect width="1000" height="640" fill="#EDF0EF"/>

  <!-- 顶栏：左边标志 + 菜单；中间面包屑和运行状态；右边系统三键 -->
  <circle cx="22" cy="18" r="7" fill="none" stroke="#0B7A66" stroke-width="2"/>
  <path d="M18 18h8M20 15v7M24 15v7" stroke="#0B7A66" stroke-width="1.4"/>
  <rect x="38" y="10" width="16" height="16" rx="3" fill="none" stroke="#4B5652"/>
  <text x="250" y="22" fill="#4B5652">omp-studio</text>
  <text x="318" y="22" fill="#9AA5A1">/</text>
  <text x="330" y="22" fill="#111816" font-weight="600">修复登录页的表单校验</text>
  <circle cx="470" cy="18" r="4" fill="#0B7A66"/>
  <text x="480" y="22" fill="#0B7A66">运行中 · 1分12秒</text>
  <text x="880" y="22" fill="#4B5652">─   ▢   ✕</text>

  <!-- 侧栏 -->
  <rect x="12" y="44" width="196" height="28" rx="6" fill="#FFFFFF" stroke="#D5DBD9"/>
