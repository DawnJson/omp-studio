<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="12">
  <!-- 方向 B「工作台」深色主界面线框：三栏，右侧常驻检查栏。颜色就是提议的色板。 -->
  <rect width="1000" height="640" fill="#0C0E14"/>

  <!-- 顶栏：只有标志、菜单和系统三键；任务信息放进主区面板头 -->
  <rect x="12" y="11" width="14" height="14" rx="3" fill="#4C7DFF"/>
  <text x="15" y="22" fill="#0C0E14" font-weight="700" font-size="11">π</text>
  <text x="36" y="22" fill="#8C93A6">≡</text>
  <text x="880" y="22" fill="#8C93A6">─   ▢   ✕</text>

  <!-- 侧栏：竖排图标条 + 列表 -->
  <rect x="0" y="36" width="44" height="604" fill="#0C0E14"/>
  <text x="16" y="64" fill="#E7EAF2">✎</text>
  <text x="16" y="96" fill="#8C93A6">⌕</text>
  <text x="16" y="128" fill="#8C93A6">⧉</text>
  <text x="16" y="624" fill="#8C93A6">⚙</text>
  <rect x="44" y="36" width="190" height="604" fill="#10131B"/>
  <rect x="54" y="46" width="170" height="26" rx="4" fill="#161A24" stroke="#262C3A"/>
  <text x="64" y="63" fill="#5E667A">搜索</text>
  <text x="56" y="96" fill="#5E667A" font-size="11">OMP-STUDIO</text>
  <rect x="50" y="104" width="178" height="26" rx="4" fill="#1B2130"/>
  <circle cx="64" cy="117" r="4" fill="#4C7DFF"/>
  <text x="76" y="121" fill="#E7EAF2">修复登录页的表单校验</text>
  <path d="M60 143l4-4 4 4-4 4z" fill="#F0B545"/>
  <text x="76" y="147" fill="#E7EAF2">升级 Electron 到 44</text>
  <text x="62" y="171" fill="#8C93A6">✓</text>
  <text x="76" y="171" fill="#8C93A6">整理 CHANGELOG</text>

  <!-- 主区面板 -->
  <rect x="234" y="36" width="530" height="604" fill="#141824"/>
  <text x="252" y="62" fill="#E7EAF2" font-size="14" font-weight="600">修复登录页的表单校验</text>
  <text x="252" y="80" fill="#5E667A" font-size="11">omp-studio · main</text>
  <line x1="234" y1="92" x2="764" y2="92" stroke="#262C3A"/>
  <rect x="276" y="108" width="400" height="32" rx="6" fill="#1B2130"/>
  <text x="290" y="129" fill="#E7EAF2" font-size="13">登录页提交时没有校验邮箱格式，修一下并补测试。</text>
  <text x="276" y="166" fill="#5E667A" font-size="11">▸ 6 步 · 38s</text>
  <text x="276" y="194" fill="#E7EAF2" font-size="13">邮箱现在用 validateEmail 校验，错误提示显示在输入框下方。</text>
  <text x="276" y="214" fill="#E7EAF2" font-size="13">新增 4 个测试，全部通过。</text>
  <rect x="252" y="532" width="494" height="88" rx="8" fill="#1B2130" stroke="#2F3749"/>
  <text x="268" y="558" fill="#5E667A" font-size="13">回复…</text>
  <text x="268" y="606" fill="#8C93A6">＋   DeepSeek V4 Flash · 高 ▾    执行 ▾    跟随 omp ▾</text>
  <rect x="712" y="590" width="24" height="22" rx="5" fill="#4C7DFF"/>
  <text x="719" y="606" fill="#0C0E14">↑</text>

  <!-- 右侧检查栏：结果、上下文、消耗、子代理 -->
  <rect x="764" y="36" width="236" height="604" fill="#10131B"/>
  <text x="780" y="62" fill="#8C93A6" font-size="11">改动</text>
  <text x="780" y="84" fill="#E7EAF2">src/login/form.ts</text>
  <text x="940" y="84" fill="#56C596" font-family="Cascadia Mono, Consolas, monospace">+40</text>
  <text x="780" y="104" fill="#E7EAF2">test/login.test.ts</text>
  <text x="940" y="104" fill="#56C596" font-family="Cascadia Mono, Consolas, monospace">+8</text>
  <rect x="780" y="116" width="204" height="24" rx="4" fill="none" stroke="#2F3749"/>
  <text x="840" y="132" fill="#E7EAF2">打开评审</text>
  <text x="780" y="172" fill="#8C93A6" font-size="11">上下文</text>
  <rect x="780" y="180" width="204" height="6" rx="3" fill="#262C3A"/>
  <rect x="780" y="180" width="70" height="6" rx="3" fill="#4C7DFF"/>
  <text x="780" y="202" fill="#8C93A6" font-family="Cascadia Mono, Consolas, monospace" font-size="11">68k / 200k  34%</text>
  <text x="780" y="232" fill="#8C93A6" font-size="11">本会话</text>
  <text x="780" y="252" fill="#E7EAF2" font-family="Cascadia Mono, Consolas, monospace">112k tok  $0.21</text>
  <text x="780" y="284" fill="#8C93A6" font-size="11">子代理</text>
  <rect x="780" y="294" width="120" height="10" rx="2" fill="#4C7DFF" opacity="0.6"/>
  <rect x="820" y="310" width="150" height="10" rx="2" fill="#4C7DFF" opacity="0.35"/>
  <text x="780" y="340" fill="#5E667A" font-size="11">explore · task</text>
</svg>
