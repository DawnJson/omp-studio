appId: dev.omp-studio.app
productName: omp-studio
directories:
  output: release
# Chromium 的界面语言包（locales/*.pak）只留界面会用到的：settings-store.ts 按 app.getLocale() 选中文 / 英文，
# getLocale 只会返回有语言包的语言；留 zh-TW 是为了繁体中文系统照旧显示中文。其余 50 多个包约 45 MB。
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
files:
  - out/**
  - package.json
  # node-pty 只需要 lib 和当前平台的原生模块：源码、依赖库、其它平台的预编译件和调试符号不打进包。
  # 其它平台按宏排除（${platform}-${arch} 在 Windows 包里是 win32-x64，mac 包里是 darwin-arm64）。
  # Linux 没有预编译件（node-pty 1.1.0 只带 win32 / darwin），npm ci 时 node-gyp 编出 build/Release/pty.node：
  # build/ 里只留它，编译中间文件不打包（Windows / mac 没有 build/，这几条不起作用）。
  # 不要在 win: / mac: / linux: 下面再写 files：平台级的 files 会整个顶替这一份（不是合并），只剩排除规则时 electron-builder
  # 退回 **/*，把整个仓库目录（含 .env、日志、截图）打进 asar（0.4.16 出过一次，2026-10-25 实测）。
  - "!node_modules/node-pty/{src,deps,third_party,scripts}/**"
  - "!node_modules/node-pty/prebuilds/!(${platform}-${arch})/**"
  - "!node_modules/node-pty/build/!(Release)"
  - "!node_modules/node-pty/build/!(Release)/**"
  - "!node_modules/node-pty/build/Release/!(pty.node)"
  - "!node_modules/node-pty/build/Release/!(pty.node)/**"
  - "!node_modules/node-pty/**/*.test.js*"
  - "!node_modules/node-pty/**/*.pdb"
# node-pty 的原生 .node、conpty 辅助文件、spawn-helper 和 worker 脚本都要在真实文件系统里（不能留在 asar 里）。
asarUnpack:
  - node_modules/node-pty/**
# node-pty 用自带的预编译件（prebuilds/<平台>-<架构>，N-API，Windows 上 Electron 44 实测可直接加载）；
# 默认的 @electron/rebuild 会尝试从源码编译，没有 VS 工具链的机器上会失败。
npmRebuild: false
# 平台无关的额外资源。托盘图标和窗口图标按平台放在 win / mac / linux 的 extraResources。
# 顶层和平台级的 extraResources 是合并的（打包产物里 licenses/ 和 tray.png 都在）；files 不是，见上。
# 图标文件都由 scripts/make-icons.ts 从 src/shared/ui/pixel-pi.ts 生成。
extraResources:
  # Geist / Geist Mono 字体（打进 out/ 的渲染进程资源）是 SIL OFL 1.1：再分发时许可证要随软件一起带上。
  - from: src/renderer/styles/fonts/OFL.txt
    to: licenses/Geist-OFL.txt
  # provider 的 logo（features/settings/ProviderLogo.tsx）拷自 LobeHub Icons，MIT：许可证随软件一起带上。
  - from: src/renderer/src/features/settings/provider-logos-LICENSE.txt
    to: licenses/lobe-icons-MIT.txt
  # omp 的协议类型（src/shared/omp-wire/rpc-wire.generated.ts、src/shared/tsp/tsp.generated.ts）拷自 oh-my-pi，MIT：许可证随软件一起带上。
  - from: src/shared/oh-my-pi-LICENSE.txt
    to: licenses/oh-my-pi-MIT.txt
# koffi 的原生 .node 在 @koromix/koffi-<平台> 包里，electron-builder 会自动把 .node 解出 asar；
# 已在打包产物里实测 koffi 能加载并调用 kernel32。
win:
  # exe、安装包和快捷方式的图标。
  icon: resources/icon.ico
  # 托盘图标（src/main/window/tray.ts 从 process.resourcesPath 读）和窗口图标（main-window.ts 同样从 resources 读）。
  extraResources:
    - from: resources/tray.png
      to: tray.png
    - from: resources/icon.ico
      to: icon.ico
  target:
    - target: dir
      arch: x64
    - target: nsis
      arch: x64
  # 不签名，但要改 exe 资源：图标和版本信息才会写进 exe（signAndEditExecutable: false 会连图标一起跳过）。
  signExecutable: false
# macOS：只出 Apple 芯片（arm64），不公证，不自动更新（见 docs/architecture/mac.md）。
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  # 菜单栏模板图（文件名带 Template：macOS 按菜单栏明暗自动反色）。
  extraResources:
    - from: resources/trayTemplate.png
      to: trayTemplate.png
    - from: resources/trayTemplate@2x.png
      to: trayTemplate@2x.png
  # 不公证，也没有开发者证书，显式 ad-hoc 签名。出处：app-builder-lib 26 的 options/macOptions.d.ts 里 identity 的说明：
  # 不设时找不到证书就跳过签名、没有自动 ad-hoc 回退；"-" 是显式启用 ad-hoc 签名。
  # 在非 mac 机器上 isSignAllowed() 为 false，签名被跳过（见 docs/architecture/mac.md）。
  identity: "-"
  # macOptions.d.ts：hardenedRuntime 默认 true，与 ad-hoc 签名一起会强制库校验，加载未同证书签名的 pty.node 会失败；不公证也用不上它。
  hardenedRuntime: false
# Linux：只出 x64 AppImage（仓库所有者 2026-10-26 定），自动更新读 Release 里的 latest-linux.yml（见 docs/architecture/linux.md）。
# 必须在 Linux 上打（node-pty 要在本机编译），由 .github/workflows/linux.yml 在 ubuntu 机器上打。
linux:
  icon: resources/icon.png
  category: Development
  executableName: omp-studio
  synopsis: Desktop app for oh-my-pi (omp)
  target:
    - target: AppImage
      arch: x64
  # 托盘图标和窗口图标（Linux 的窗口图标要 png，main-window.ts 从 resources 读）。
  extraResources:
    - from: resources/tray.png
      to: tray.png
    - from: resources/icon.png
      to: icon.png
appImage:
  artifactName: ${name}-${version}-x86_64.${ext}
# AppImage 的运行时用静态版（toolsets.appimage 1.0.3，内置 FUSE），不依赖系统的 libfuse2：
# Ubuntu 22.04 起默认不装 libfuse2，旧版运行时在那里直接报 "AppImages require FUSE to run"（2026-10-26 在 ubuntu-24.04 上实测，见 docs/architecture/linux.md）。
toolsets:
  appimage: "1.0.3"
# Windows 的 NSIS 安装器：向导式安装（仓库所有者 2026-10-25 定）：欢迎 → 许可协议 → 安装目录 → 安装 → 完成，
# 补充的页面和"只装给当前用户"在 resources/installer.nsh；装到用户目录，不需要管理员权限。自动更新时静默运行，不显示页面。
# 向导图片由 scripts/make-icons.ts 生成；安装器界面语言跟系统走（中文系统中文，其余英文）。
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  license: LICENSE
  include: resources/installer.nsh
  installerSidebar: resources/installerSidebar.bmp
  installerHeader: resources/installerHeader.bmp
  installerLanguages: [zh_CN, en_US]
  artifactName: ${name}-${version}-setup.${ext}
# 更新源：本仓库的 GitHub Releases（仓库所有者 2026-10-25 定）。打包时写进 resources/app-update.yml，
# 应用从最新的正式 Release 里读 latest.yml，再下载同一个 Release 里的安装包（有上一版的 .blockmap 时只下变了的块）。
# 只在仓库公开时能用：私有仓库的 Releases 要 token，不能写进应用。发版上传哪些文件见 scripts/publish-release.ts。
# 打包一律 --publish never，不让 electron-builder 自己上传。
# 顶层 publish 对 mac / linux 也生效（包里也会有 app-update.yml）。主进程在 mac 上不检查更新（见 docs/architecture/mac.md）；
# Linux 的 AppImage 照常检查，读 latest-linux.yml。
publish:
  provider: github
  owner: DawnJson
  repo: omp-studio
  releaseType: release
