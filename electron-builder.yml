appId: dev.omp-studio.app
productName: omp-studio
directories:
  output: release
files:
  - out/**
  - package.json
# koffi 的原生 .node 在 @koromix/koffi-<平台> 包里，electron-builder 会自动把 .node 解出 asar；
# 已在打包产物里实测 koffi 能加载并调用 kernel32。
win:
  target:
    - target: dir
      arch: x64
    - target: nsis
      arch: x64
  signAndEditExecutable: false
# 自动更新只认安装版（NSIS）。装到用户目录，不需要管理员权限。
nsis:
  oneClick: true
  perMachine: false
  artifactName: ${name}-${version}-setup.${ext}
publish: null
